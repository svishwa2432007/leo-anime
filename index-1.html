<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Anime</title>
<meta name="description" content="Leo Anime: discover trending and popular anime, build a watchlist, and watch authorized episodes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<style>
:root{--bg:#000;--panel:#0d0a14;--line:#241a38;--text:#f1ecfa;--mute:#a79cc0;--p:#a855f7;--p2:#7c3aed;--glow:0 0 18px rgba(168,85,247,.55)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--p);outline-offset:3px;border-radius:6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;z-index:30;transition:transform .25s}
.logo{font:900 1.6rem/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;padding:4px 10px 18px;text-shadow:var(--glow)}
.logo b{color:var(--p)}
#side a{padding:10px 12px;border-radius:10px;color:var(--mute)}
#side a:hover{background:#1a1228;color:var(--text)}
#side a.on{background:linear-gradient(90deg,var(--p2),#4c1d95);color:#fff;box-shadow:var(--glow)}
#side small{margin-top:auto;color:var(--mute);padding:0 10px}
#top{margin-left:230px;position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 28px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#q{flex:1;max-width:520px;background:#120d1c;border:1px solid var(--line);border-radius:24px;padding:9px 18px}
#q:focus{border-color:var(--p);box-shadow:var(--glow);outline:0}
main{margin-left:230px;padding:24px 28px 60px;min-height:80vh}
h1,h2{line-height:1.2}
h1{font-size:2rem}
h2{font-size:1.3rem;margin:30px 0 14px}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#2e1065,#000) center/cover;border:1px solid var(--line);box-shadow:var(--glow)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000 5%,rgba(0,0,0,.2) 70%)}
.hero>div{position:relative;z-index:1;padding:28px;max-width:640px}
.hero p{color:#d6cde8;margin:8px 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-block;border:1px solid var(--p);background:var(--p2);padding:10px 20px;border-radius:24px;font-weight:700;margin-right:8px;transition:box-shadow .2s,transform .2s}
.btn:hover{box-shadow:var(--glow);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:170px;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-color:var(--p2) #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{display:block;position:relative;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:var(--glow);border-color:var(--p)}
.poster{aspect-ratio:2/3;background:linear-gradient(160deg,#3b0764,#0d0a14);display:grid;place-items:center;font:900 3rem Impact,sans-serif;color:#6b21a8}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);border:1px solid var(--p);border-radius:8px;padding:1px 7px;font-size:.8rem}
.meta{padding:9px 10px 11px}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.92rem}
.meta span{color:var(--mute);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:#120d1c;border-radius:20px;padding:5px 14px;font-size:.9rem;color:var(--mute)}
.chip:hover,.chip.on{border-color:var(--p);color:#fff;background:#2a1650}
.skel{aspect-ratio:2/3;border-radius:12px;background:linear-gradient(90deg,#120d1c,#241a38,#120d1c) 0 0/200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.note{border:1px solid var(--line);border-left:4px solid var(--p);background:var(--panel);padding:12px 16px;border-radius:10px;margin:14px 0;color:#d6cde8}
.detail{display:grid;grid-template-columns:220px 1fr;gap:26px;margin-top:-70px;position:relative;z-index:1;padding:0 8px}
.banner{height:220px;border-radius:18px;background:linear-gradient(135deg,#2e1065,#000) center/cover;border:1px solid var(--line)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.eps a{border:1px solid var(--line);background:var(--panel);padding:10px;border-radius:10px}
.eps a:hover,.eps a.on{border-color:var(--p);background:#2a1650}
.player{background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--glow)}
.player video,.player iframe,.ph{width:100%;aspect-ratio:16/9;display:block;background:#000;border:0}
.ph{display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--panel)}
.ctl button{background:#1a1228;border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.ctl button:hover{border-color:var(--p)}
.ctl input[type=range]{accent-color:var(--p)}
#seek{flex:1;min-width:140px}
.more{display:block;margin:26px auto}
footer{margin-left:230px;padding:20px 28px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}
footer a{text-decoration:underline;margin-right:14px}
@media(max-width:820px){
#side{transform:translateX(-100%)}#side.open{transform:none}
#top,main,footer{margin-left:0}#top{padding:10px 14px}main{padding:16px 14px 50px}
#menu{display:block}.detail{grid-template-columns:1fr;margin-top:-40px}.detail .poster{max-width:180px}
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.row{grid-auto-columns:140px}h1{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav id="side" aria-label="Main">
  <div class="logo">LEO<b>ANIME</b></div>
  <a href="#/">Home</a><a href="#/trending">Trending</a><a href="#/popular">Popular</a>
  <a href="#/movies">Anime Movies</a><a href="#/genres">Genres</a><a href="#/watchlist">My Watchlist</a>
  <a href="#/about">About</a><a href="#/legal">Privacy &amp; Copyright</a>
  <small>Metadata by AniList</small>
</nav>
<header id="top">
  <button id="menu" aria-label="Open menu" aria-expanded="false">☰</button>
  <input id="q" type="search" placeholder="Search anime…" aria-label="Search anime" autocomplete="off">
</header>
<main id="app" tabindex="-1"></main>
<footer>© Leo Anime · <a href="#/about">About</a><a href="#/legal">Privacy &amp; Copyright</a>Anime information and images come from AniList. Leo Anime does not host episodes.</footer>

<script>
/* ========= CONFIG: connect AUTHORIZED video sources here =========
   Key = AniList anime ID (it is the number in the details-page URL: #/anime/16498).
   Use only videos you own or are licensed to stream, or embeds the provider allows.
   Example:
   const SOURCES = {
     16498: [
       { title: "Episode 1", url: "videos/my-episode-1.mp4" },          // your own file
       { title: "Episode 2", embed: "https://example.com/embed/xyz" }  // permitted embed
     ]
   };
*/
const SOURCES = {};

/* ========= Helpers ========= */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Romance','Horror','Sci-Fi'];

/* ========= Data (AniList GraphQL + fallback) ========= */
const FIELDS = `id title{romaji english} synonyms coverImage{large} bannerImage description(asHtml:false) genres averageScore seasonYear episodes format status`;
const cache = new Map();
async function gql(query, variables) {
  const key = query + JSON.stringify(variables);
  if (cache.has(key)) return cache.get(key);
  const r = await fetch('https://graphql.anilist.co', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables })
  });
  if (!r.ok) throw new Error(r.status === 429 ? 'Too many requests. Wait a minute and try again.' : 'AniList error ' + r.status);
  const j = await r.json();
  if (j.errors) throw new Error(j.errors[0].message);
  cache.set(key, j.data);
  return j.data;
}
function norm(m) {
  const t = m.title.english || m.title.romaji;
  return { id: m.id, title: t, alt: [m.title.romaji, ...(m.synonyms || [])].filter(x => x && x !== t).slice(0, 4),
    cover: m.coverImage?.large, banner: m.bannerImage, desc: (m.description || 'No synopsis available.').replace(/<[^>]+>/g, ' '),
    genres: m.genres || [], score: m.averageScore, year: m.seasonYear, eps: m.episodes, format: m.format, status: m.status,
    recs: (m.recommendations?.nodes || []).map(n => n.mediaRecommendation).filter(Boolean).map(norm) };
}
const FALLBACK = [
  ['Sample: Neon Blade',['Action','Sci-Fi'],85,24],['Sample: Moonlit Letters',['Romance','Drama'],79,12],
  ['Sample: Dragon Kitchen',['Comedy','Fantasy'],81,13],['Sample: Hollow Hall',['Horror','Drama'],74,12],
  ['Sample: Skyward Crew',['Adventure','Fantasy'],88,26],['Sample: Orbit Nine',['Sci-Fi','Adventure'],83,25]
].map((a, i) => ({ id: -(i + 1), title: a[0], alt: [], genres: a[1], score: a[2], eps: a[3], year: 2024, format: 'TV', status: 'FINISHED',
  desc: 'Offline sample entry shown because AniList could not be reached. Reload to try again.', recs: [] }));
const seen = new Map();
async function list(v, per = 24) {
  try {
    const d = await gql(`query($page:Int,$per:Int,$search:String,$sort:[MediaSort],$genre:String,$format:MediaFormat,$status:MediaStatus){
      Page(page:$page,perPage:$per){pageInfo{hasNextPage} media(type:ANIME,isAdult:false,search:$search,sort:$sort,genre:$genre,format:$format,status:$status){${FIELDS}}}}`,
      { page: 1, per, ...v });
    const items = d.Page.media.map(norm); items.forEach(i => seen.set(i.id, i));
    return { items, more: d.Page.pageInfo.hasNextPage };
  } catch (e) {
    console.warn(e);
    let items = FALLBACK.filter(i => (!v.genre || i.genres.includes(v.genre)) && (!v.search || i.title.toLowerCase().includes(v.search.toLowerCase())));
    items.forEach(i => seen.set(i.id, i));
    return { items, more: false, offline: true };
  }
}
async function detail(id) {
  if (id < 0) return FALLBACK.find(i => i.id === id);
  const d = await gql(`query($id:Int){Media(id:$id,type:ANIME){${FIELDS} recommendations(perPage:8,sort:RATING_DESC){nodes{mediaRecommendation{${FIELDS}}}}}}`, { id });
  const m = norm(d.Media); seen.set(m.id, m); return m;
}

/* ========= Watchlist & progress ========= */
const wl = () => store.get('leo_watchlist', []);
const inWL = id => wl().some(a => a.id === id);
function toggleWL(a) {
  const l = wl(), i = l.findIndex(x => x.id === a.id);
  i < 0 ? l.push({ id: a.id, title: a.title, cover: a.cover, score: a.score, genres: a.genres, eps: a.eps }) : l.splice(i, 1);
  store.set('leo_watchlist', l);
}
const progress = () => store.get('leo_progress', {});

/* ========= Views ========= */
const card = a => `<a class="card" href="#/anime/${a.id}" aria-label="${esc(a.title)}">
  <div class="poster">${a.cover ? `<img src="${esc(a.cover)}" alt="" loading="lazy">` : esc(a.title.replace('Sample: ', '')[0])}</div>
  ${a.score ? `<span class="badge">★ ${(a.score / 10).toFixed(1)}</span>` : ''}
  <div class="meta"><b>${esc(a.title)}</b><span>${esc(a.genres.slice(0, 2).join(', '))}${a.eps ? ' · ' + a.eps + ' eps' : ''}</span></div></a>`;
const skels = n => Array(n).fill('<div class="skel"></div>').join('');
const offlineNote = `<div class="note" role="status">AniList could not be reached, so sample entries are shown. Check your internet connection and reload.</div>`;

async function homeRow(title, v, link) {
  const box = document.createElement('section');
  box.innerHTML = `<h2>${title}${link ? ` <a href="${link}" style="font-size:.85rem;color:var(--p)">See all</a>` : ''}</h2><div class="row">${skels(7)}</div>`;
  app.append(box);
  const r = await list(v, 14);
  box.querySelector('.row').innerHTML = r.items.length ? r.items.map(card).join('') : '<p class="note">Nothing found.</p>';
  return r;
}
async function home() {
  app.innerHTML = '';
  const hero = document.createElement('div'); hero.className = 'hero'; hero.innerHTML = '<div><h1>Loading…</h1></div>'; app.append(hero);
  const cont = Object.entries(progress());
  if (cont.length) {
    const s = document.createElement('section');
    s.innerHTML = `<h2>Continue watching</h2><div class="row">${cont.slice(-8).reverse().map(([k, p]) => `<a class="card" href="#/watch/${p.id}/${p.ep}"><div class="poster">${p.cover ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : '▶'}</div><div class="meta"><b>${esc(p.title)}</b><span>Episode ${p.ep + 1} · ${Math.floor(p.t / 60)}m in</span></div></a>`).join('')}</div>`;
    app.append(s);
  }
  const first = await homeRow('Trending now', { sort: ['TRENDING_DESC'] }, '#/trending');
  const h = first.items[0];
  if (h) {
    if (h.banner) hero.style.backgroundImage = `url("${h.banner}")`;
    hero.innerHTML = `<div><h1>${esc(h.title)}</h1><p>${esc(h.desc)}</p><a class="btn" href="#/watch/${h.id}/0">Watch now</a><a class="btn ghost" href="#/anime/${h.id}">Details</a></div>`;
  }
  if (first.offline) app.prepend(Object.assign(document.createElement('div'), { innerHTML: offlineNote }).firstChild);
  await homeRow('Popular', { sort: ['POPULARITY_DESC'] }, '#/popular');
  await homeRow('Recently added', { sort: ['ID_DESC'], status: 'RELEASING' });
  await homeRow('Anime movies', { sort: ['POPULARITY_DESC'], format: 'MOVIE' }, '#/movies');
}

async function gridView(title, v, head = '') {
  document.title = title + ' · Leo Anime';
  app.innerHTML = `<h1>${esc(title)}</h1>${head}<div class="grid" id="g">${skels(12)}</div><div id="st"></div>`;
  let page = 1, shown = 0;
  const g = $('#g'), st = $('#st');
  async function load() {
    st.innerHTML = '';
    const r = await list({ ...v, page });
    if (page === 1) g.innerHTML = '';
    if (r.offline) st.innerHTML = offlineNote;
    g.insertAdjacentHTML('beforeend', r.items.map(card).join(''));
    shown += r.items.length;
    if (!shown) st.innerHTML = '<div class="note">No anime found. Try a different search or genre.</div>';
    if (r.more) { st.insertAdjacentHTML('beforeend', '<button class="btn more" id="lm">Load more</button>'); $('#lm').onclick = () => { page++; $('#lm').textContent = 'Loading…'; load(); }; }
  }
  load();
}
const chips = cur => `<div class="chips" role="group" aria-label="Genres">${GENRES.map(g => `<a class="chip ${g === cur ? 'on' : ''}" href="#/genres/${g}">${g}</a>`).join('')}</div>`;

async function detailView(id) {
  app.innerHTML = '<div class="banner"></div><div class="detail"><div class="skel"></div><div>Loading…</div></div>';
  let a; try { a = await detail(id); } catch (e) { return app.innerHTML = `<div class="note" role="alert">Could not load this anime: ${esc(e.message)}. <a href="#/" style="text-decoration:underline">Back home</a></div>`; }
  document.title = a.title + ' · Leo Anime';
  const src = SOURCES[a.id] || [];
  app.innerHTML = `<div class="banner" ${a.banner ? `style="background-image:url('${esc(a.banner)}')"` : ''}></div>
  <div class="detail"><div class="poster card" style="aspect-ratio:2/3">${a.cover ? `<img src="${esc(a.cover)}" alt="Poster of ${esc(a.title)}">` : esc(a.title[0])}</div>
  <div><h1>${esc(a.title)}</h1>
  ${a.alt.length ? `<p style="color:var(--mute)">${a.alt.map(esc).join(' · ')}</p>` : ''}
  <p style="margin:8px 0">${a.score ? '★ ' + (a.score / 10).toFixed(1) + ' · ' : ''}${a.year || 'Year unknown'}${a.format ? ' · ' + esc(a.format.replace('_', ' ')) : ''}${a.eps ? ' · ' + a.eps + ' episodes' : ''}${a.status ? ' · ' + esc(a.status.replace('_', ' ').toLowerCase()) : ''}</p>
  <div class="chips">${a.genres.map(g => `<a class="chip" href="#/genres/${esc(g)}">${esc(g)}</a>`).join('')}</div>
  <p style="max-width:70ch">${esc(a.desc)}</p>
  <p style="margin-top:18px"><a class="btn" href="#/watch/${a.id}/0">Watch now</a><button class="btn ghost" id="wl" aria-pressed="${inWL(a.id)}"></button></p></div></div>
  <h2>Episodes</h2>${src.length ? `<div class="eps">${src.map((s, i) => `<a href="#/watch/${a.id}/${i}">${esc(s.title || 'Episode ' + (i + 1))}</a>`).join('')}</div>` : `<div class="note">No authorized video source is configured for this anime yet.${a.eps ? ` AniList lists ${a.eps} episodes.` : ''} See the README to connect one.</div>`}
  ${a.recs.length ? `<h2>Similar anime</h2><div class="row">${a.recs.map(card).join('')}</div>` : ''}`;
  const b = $('#wl'), paint = () => { b.textContent = inWL(a.id) ? '✓ In watchlist' : '+ Add to watchlist'; b.setAttribute('aria-pressed', inWL(a.id)); };
  paint(); b.onclick = () => { toggleWL(a); paint(); };
}

async function watchView(id, ep) {
  app.innerHTML = '<p>Loading…</p>';
  let a; try { a = await detail(id); } catch (e) { return app.innerHTML = `<div class="note" role="alert">${esc(e.message)}</div>`; }
  document.title = 'Watch ' + a.title + ' · Leo Anime';
  const src = SOURCES[id] || [], s = src[ep];
  if (!s) {
    app.innerHTML = `<h1>${esc(a.title)}</h1><div class="player"><div class="ph"><div><h2>No authorized video source connected</h2><p>Leo Anime does not host or link to unlicensed episodes. Add a video you own, a licensed file, or a permitted embed to <code>SOURCES</code> in index.html using this anime's ID (<b>${id}</b>).</p></div></div></div><p style="margin-top:16px"><a class="btn ghost" href="#/anime/${id}">Back to details</a></p>`;
    return;
  }
  const next = src[ep + 1];
  app.innerHTML = `<h1>${esc(a.title)}</h1><p style="color:var(--mute);margin-bottom:12px">${esc(s.title || 'Episode ' + (ep + 1))}</p>
  <div class="player">${s.embed ? `<iframe src="${esc(s.embed)}" allowfullscreen title="Player"></iframe>` : `<video id="v" preload="metadata" playsinline></video><div id="err" class="note" role="alert" hidden></div>
  <div class="ctl"><button id="pp" aria-label="Play or pause">▶</button><span id="tm">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><label>🔊 <input id="vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume"></label>
  <button id="fs" aria-label="Fullscreen">⛶</button></div>`}</div>
  <p style="margin:16px 0">${ep > 0 ? `<a class="btn ghost" href="#/watch/${id}/${ep - 1}">Previous</a>` : ''}${next ? `<a class="btn" href="#/watch/${id}/${ep + 1}">Next episode</a>` : ''}<a class="btn ghost" href="#/anime/${id}">Details</a></p>
  <h2>Episodes</h2><div class="eps">${src.map((x, i) => `<a class="${i === ep ? 'on' : ''}" href="#/watch/${id}/${i}">${esc(x.title || 'Episode ' + (i + 1))}</a>`).join('')}</div>`;
  if (s.embed) return;
  const v = $('#v'), err = $('#err'), fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';
  v.src = s.url;
  const saved = progress()[id + ':' + ep]; if (saved) v.addEventListener('loadedmetadata', () => { v.currentTime = saved.t; }, { once: true });
  $('#pp').onclick = () => v.paused ? v.play() : v.pause();
  v.onclick = $('#pp').onclick;
  v.onplay = () => $('#pp').textContent = '❚❚'; v.onpause = () => $('#pp').textContent = '▶';
  v.ontimeupdate = () => {
    $('#tm').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
    if (v.duration) $('#seek').value = v.currentTime / v.duration * 1000;
    if (Math.floor(v.currentTime) % 5 === 0) { const p = progress(); p[id + ':' + ep] = { id, ep, t: v.currentTime, title: a.title, cover: a.cover }; store.set('leo_progress', p); }
  };
  v.onwaiting = () => { err.hidden = false; err.textContent = 'Buffering…'; err.setAttribute('role', 'status'); };
  v.onplaying = () => err.hidden = true;
  v.onerror = () => { err.hidden = false; err.setAttribute('role', 'alert'); err.textContent = 'This video could not be played. Check the URL in SOURCES and that the file format is supported (MP4/WebM).'; };
  v.onended = () => { if (next) location.hash = `#/watch/${id}/${ep + 1}`; };
  $('#seek').oninput = e => { if (v.duration) v.currentTime = e.target.value / 1000 * v.duration; };
  $('#vol').oninput = e => v.volume = e.target.value;
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : v.parentElement.requestFullscreen?.();
}

function watchlistView() {
  document.title = 'My Watchlist · Leo Anime';
  const l = wl();
  app.innerHTML = `<h1>My Watchlist</h1>` + (l.length ? `<p style="color:var(--mute);margin:6px 0 16px">Saved in this browser only.</p><div class="grid">${l.map(a => `<div>${card(a)}<button class="chip" style="margin-top:8px;width:100%" data-rm="${a.id}">Remove</button></div>`).join('')}</div>`
    : `<div class="note">Your watchlist is empty. Open any anime and choose “Add to watchlist”. <a href="#/trending" style="text-decoration:underline">Browse trending</a></div>`);
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { toggleWL({ id: +b.dataset.rm }); watchlistView(); });
}

const pages = {
  about: ['About Leo Anime', `<p>Leo Anime is a free anime discovery site. Titles, descriptions, ratings and cover images come from the AniList API. Episodes play only when the site owner connects a video source they are authorized to stream.</p><p style="margin-top:12px">Your watchlist and playback progress are stored in your own browser.</p>`],
  legal: ['Privacy, Copyright & Contact', `<h2>Privacy</h2><p>No account is needed. Your watchlist, progress and nothing else is saved in your browser's localStorage. We run no trackers. Requests for anime data are sent to AniList.</p>
  <h2>Copyright</h2><p>Leo Anime does not host, copy or link to unlicensed episodes. Anime metadata and images are provided by AniList and belong to their respective rights holders. To report a copyright concern, email <b>your-email@example.com</b> (replace this with your own address).</p>`]
};

/* ========= Router ========= */
function route() {
  const [, p = '', a, b] = location.hash.slice(1).split('/');
  $('#side').classList.remove('open'); $('#menu').setAttribute('aria-expanded', 'false');
  document.querySelectorAll('#side a').forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#/' + p));
  window.scrollTo(0, 0);
  const D = decodeURIComponent;
  if (!p) { document.title = 'Leo Anime · Discover and watch anime'; home(); }
  else if (p === 'trending') gridView('Trending anime', { sort: ['TRENDING_DESC'] });
  else if (p === 'popular') gridView('Popular anime', { sort: ['POPULARITY_DESC'] });
  else if (p === 'movies') gridView('Anime movies', { sort: ['POPULARITY_DESC'], format: 'MOVIE' });
  else if (p === 'genres') gridView(a ? D(a) + ' anime' : 'Genres', a ? { genre: D(a), sort: ['POPULARITY_DESC'] } : { sort: ['POPULARITY_DESC'] }, chips(a && D(a)));
  else if (p === 'search') gridView('Results for “' + D(a || '') + '”', { search: D(a || ''), sort: ['SEARCH_MATCH'] });
  else if (p === 'anime') detailView(+a);
  else if (p === 'watch') watchView(+a, +b || 0);
  else if (p === 'watchlist') watchlistView();
  else if (pages[p]) { document.title = pages[p][0] + ' · Leo Anime'; app.innerHTML = `<h1>${pages[p][0]}</h1><div style="max-width:70ch;margin-top:12px">${pages[p][1]}</div>`; }
  else app.innerHTML = '<div class="note">Page not found. <a href="#/" style="text-decoration:underline">Go home</a></div>';
}
addEventListener('hashchange', route);
let t; $('#q').addEventListener('input', e => { clearTimeout(t); const v = e.target.value.trim(); t = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 400); });
$('#menu').onclick = () => { const o = $('#side').classList.toggle('open'); $('#menu').setAttribute('aria-expanded', o); };
route();
</script>
</body>
</html>
